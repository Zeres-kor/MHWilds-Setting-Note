name: Deploy MHWids to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and test import and tag rules
        run: |
          for script in prototype/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
